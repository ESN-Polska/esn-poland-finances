<ion-content class="auth-content ion-padding">
  <div class="auth-wrapper">
    <div class="top-controls">
      <ion-button
        fill="clear"
        class="theme-toggle-btn"
        (click)="appService.cycleThemePreference()"
        [title]="('COMMON.THEME' | translate) + ': ' + appService.getThemeLabel()"
      >
        <ion-icon slot="icon-only" [name]="appService.getThemeIcon()"></ion-icon>
      </ion-button>

      <div class="lang-selector">
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang === 'en'"
          (click)="setLang('en')"
        >
          EN
        </button>
        <span class="lang-divider">|</span>
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang === 'pl'"
          (click)="setLang('pl')"
        >
          PL
        </button>
      </div>
    </div>

    <ion-card class="auth-card">
      <ion-card-content class="ion-text-center">
        <div class="logo-container">
          <img
            [src]="appService.getIcon(appService.isInDarkMode())"
            [alt]="appService.configurations?.appTitle || 'ESN Poland'"
            class="app-logo"
          />
        </div>

        <p class="app-subtitle">{{ appService.getAppSubtitle() }}</p>
        <h1 class="app-title">{{ appService.getAppTitle() }}</h1>

        <div class="divider"></div>

        <div *ngIf="isProcessing" class="loading-state">
          <ion-spinner name="crescent" color="primary"></ion-spinner>
          <p class="loading-text">{{ (isGuestLogin ? 'AUTH.GUEST_VERIFYING' : 'AUTH.LOGGING_IN') | translate }}</p>
        </div>

        <!-- Guest Link Error Notice (replaces login button) -->
        <div *ngIf="!isProcessing && guestErrorKey" class="guestErrorCard">
          <div class="guestErrorIcon">
            <ion-icon name="alert-circle-outline"></ion-icon>
          </div>
          <h3 class="guestErrorTitle">{{ 'AUTH.GUEST_LINK_UNAVAILABLE' | translate }}</h3>
          <p class="guestErrorDesc">{{ guestErrorKey | translate }}</p>
        </div>

        <!-- Standard Login Button (hidden if guest link error notice is displayed) -->
        <div *ngIf="!isProcessing && !guestErrorKey" class="action-section">
          <ion-button
            expand="block"
            class="login-button"
            (click)="login()"
          >
            <ion-icon slot="start" name="log-in-outline"></ion-icon>
            {{ 'AUTH.LOGIN_BUTTON' | translate }}
          </ion-button>
        </div>

        <p class="version">v{{ version }}</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
