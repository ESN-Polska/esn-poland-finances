<ion-header>
  <ion-toolbar color="ideaToolbar">
    <ion-title>{{ (isNew ? 'FINANCES.MODALS.BUDGET_CATEGORY.TITLE_NEW' : 'FINANCES.MODALS.BUDGET_CATEGORY.TITLE_EDIT') | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding categoryModalContent">
  <div class="categoryModalWrapper">
    <!-- Category Name PL -->
    <div class="fieldCol">
      <label>{{ 'FINANCES.MODALS.BUDGET_CATEGORY.NAME_PL' | translate }} *</label>
      <ion-item lines="none" class="inputItem">
        <ion-input
          type="text"
          [(ngModel)]="namePl"
          [placeholder]="'FINANCES.MODALS.BUDGET_CATEGORY.NAME_PL_PH' | translate"
        ></ion-input>
      </ion-item>
    </div>

    <!-- Category Name EN -->
    <div class="fieldCol">
      <label>{{ 'FINANCES.MODALS.BUDGET_CATEGORY.NAME_EN' | translate }}</label>
      <ion-item lines="none" class="inputItem">
        <ion-input
          type="text"
          [(ngModel)]="nameEn"
          [placeholder]="'FINANCES.MODALS.BUDGET_CATEGORY.NAME_EN_PH' | translate"
        ></ion-input>
      </ion-item>
    </div>

    <!-- Sections Selection -->
    <div class="fieldCol sectionsConfigCol">
      <label>{{ 'FINANCES.MODALS.BUDGET_CATEGORY.SECTIONS_LABEL' | translate }}</label>
      <p class="fieldHint">{{ 'FINANCES.MODALS.BUDGET_CATEGORY.SECTIONS_HINT' | translate }}</p>
      <div class="sectionsCheckboxGroup">
        <label class="sectionCheckboxCard" [class.checked]="includeRevenues">
          <input type="checkbox" [(ngModel)]="includeRevenues" />
          <div class="secCheckInfo">
            <span class="secCheckBadge revBadge">{{ 'FINANCES.MODALS.BUDGET_CATEGORY.INCLUDE_REVENUES' | translate }}</span>
            <span class="secCheckDesc">{{ 'FINANCES.BUDGET.REVENUES' | translate }}</span>
          </div>
        </label>

        <label class="sectionCheckboxCard" [class.checked]="includeExpenses">
          <input type="checkbox" [(ngModel)]="includeExpenses" />
          <div class="secCheckInfo">
            <span class="secCheckBadge expBadge">{{ 'FINANCES.MODALS.BUDGET_CATEGORY.INCLUDE_EXPENSES' | translate }}</span>
            <span class="secCheckDesc">{{ 'FINANCES.BUDGET.EXPENSES' | translate }}</span>
          </div>
        </label>
      </div>
    </div>

    <!-- Optional result narrative explanation (PL) -->
    <div class="fieldCol">
      <label>{{ 'FINANCES.MODALS.BUDGET_CATEGORY.EXPLANATION_PL' | translate }}</label>
      <ion-item lines="none" class="inputItem textareaItem">
        <ion-textarea
          [(ngModel)]="explanationPl"
          [autoGrow]="true"
          rows="3"
          [placeholder]="'FINANCES.MODALS.BUDGET_CATEGORY.EXPLANATION_PL_PH' | translate"
        ></ion-textarea>
      </ion-item>
    </div>

    <!-- Optional result narrative explanation (EN) -->
    <div class="fieldCol">
      <label>{{ 'FINANCES.MODALS.BUDGET_CATEGORY.EXPLANATION_EN' | translate }}</label>
      <ion-item lines="none" class="inputItem textareaItem">
        <ion-textarea
          [(ngModel)]="explanationEn"
          [autoGrow]="true"
          rows="3"
          [placeholder]="'FINANCES.MODALS.BUDGET_CATEGORY.EXPLANATION_EN_PH' | translate"
        ></ion-textarea>
      </ion-item>
    </div>

    <!-- Actions -->
    <div class="modalActions">
      <ion-button fill="outline" color="medium" (click)="close()">
        {{ 'COMMON.CANCEL' | translate }}
      </ion-button>
      <ion-button fill="solid" color="primary" (click)="save()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        {{ 'COMMON.SAVE' | translate }}
      </ion-button>
    </div>
  </div>
</ion-content>
