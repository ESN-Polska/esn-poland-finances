<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>ESN Poland Finances app</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/svg+xml" href="assets/icons/icon-small.svg" />
    <link rel="apple-touch-icon" href="assets/icons/icon-store.jpg" />

    <!-- add to homescreen for iOS/Android -->
    <meta name="theme-color" content="#002b49" />
    <meta name="apple-mobile-web-app-title" content="ESN Poland Finances" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('themePreference') || 'auto';
          var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.body.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.body.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var ac = localStorage.getItem('accentColor');
          if (ac && ac !== 'default') document.body.classList.add('accent-' + ac);
        } catch (_) {}
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
